# Promote a Spaces prerelease to the stable update feed.
#
# Trigger: the `released` release event, which GitHub fires when an existing prerelease is
# switched to a full release -- that is, when a maintainer edits the release and selects "Latest".
# The releases UI offers pre-release and latest as a single radio choice, so that one selection
# clears the pre-release flag and pins `latest` in one update (`gh release edit <tag>
# --prerelease=false --latest` on the CLI). That gesture is the whole promotion; this workflow is
# what makes it visible to installed Macs.
#
# The `released` event does not fire for a release created by the Actions token, so release.yml
# publishing a prerelease cannot trigger this workflow and there is no loop.
#
# Promotion moves no artifacts. Once `latest` names the promoted release, the website's `prebuild`
# (scripts/stage-web-releases.sh) builds the stable feed from `releases/latest/download`, so
# redeploying the site from the promoted commit is all that is required. The build itself is
# byte-for-byte the one that was already tested as a prerelease.
#
# Required secrets:
#   FIREBASE_SERVICE_ACCOUNT_SPACES_A1814 - Firebase Hosting service account JSON.

name: Release Promote

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # The promoted release's own commit, not the default branch tip: the deployed site must be
      # the one this release shipped with, and `main` has moved on since the tag was cut.
      - name: Checkout the released commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      # Ordered before the site build because the build resolves the stable feed through
      # `releases/latest/download`. Selecting "Latest" moves the marker in the same update that
      # raises this event, but a promotion made some other way (clearing the pre-release flag
      # alone, or via the API) can leave `latest` on an earlier release, and a site rebuilt in that
      # state would quietly republish the previous release as stable -- so fail here instead,
      # before anything deploys.
      - name: Confirm GitHub latest resolves to the promoted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::GitHub's latest release is $latest_tag, not the promoted $RELEASE_TAG. The stable feed would publish the wrong build." >&2
            exit 1
          fi
          echo "✓ GitHub latest is $latest_tag"

      - name: Build website with staged Sparkle feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Deploy Firebase Hosting
        # The verification step below is the gate: a live-channel deploy of an unchanged site
        # answers HTTP 400 "is the current active version", which is a no-op rather than a failure.
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPACES_A1814 }}
          channelId: live
          projectId: spaces-a1814

      - name: Confirm the stable feed serves the promoted release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: scripts/verify-live-appcast.sh https://usespaces.dev/releases/appcast.xml "${RELEASE_TAG#v}"
