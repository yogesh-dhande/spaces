# Cut a nightly Spaces build once a day (or on demand) from the tip of main.
#
# Nightly versions are 4 dotted numeric components (<latest stable version>.<YYYYMMDDHHMM> in UTC,
# e.g. 0.5.1.202607250900) rather than a "-nightly" suffix on the stable version. SpacesWireProtocol
# .isVersion (apps/macos/Sources/spacesterminalcore/SpacesWireProtocol.swift) compares versions by
# splitting on "." and mapping any non-numeric component to 0, so a suffixed string like
# "0.5.1-nightly" would compare as if every component past the numeric prefix were 0 — sorting
# BELOW the 0.5.1 release it was built from. A 4th numeric component sorts correctly instead.
#
# The same UTC timestamp is also the CFBundleVersion, which is what Sparkle compares to decide
# whether an update is newer. Both carry minute precision because a manual workflow_dispatch can
# cut a second nightly on a day the schedule already ran: two builds sharing a marketing version
# would update through Sparkle but leave the daemon, which compares marketing versions to spot a
# staged build, running the earlier binary.
#
# The actual build (signing, packaging, notarization, GitHub Release, Sparkle appcast, website
# deploy) lives in release-build.yml, the same reusable workflow release.yml calls for the stable
# channel, so nightly and stable run byte-for-byte the same body apart from channel: nightly.
#
# The nightly also cuts a TestFlight iOS build by calling ios-release.yml with the latest stable
# marketing version and the timestamp build number; see the `ios` job below for why.

name: Nightly

on:
  schedule:
    - cron: "0 9 * * *" # 02:00 PT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build-needed: ${{ steps.decide.outputs.build-needed }}
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      release-tag: ${{ steps.decide.outputs.release-tag }}
      stable-version: ${{ steps.decide.outputs.stable-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Nightly versioning is derived from tag history (latest stable tag, latest nightly
          # tag), which a shallow checkout does not have.
          fetch-depth: 0

      - name: Decide whether to build and compute version
        id: decide
        run: |
          set -euo pipefail

          # `|| true` on both pipelines below: git's tag globs are fnmatch and cannot express
          # "exactly three components", so the component count is enforced by grep -- which exits
          # 1 when nothing matches. Under `set -euo pipefail` that status propagates out of the
          # command substitution and kills the step, so the very first nightly run (no nightly
          # tags yet) would die here, and the explicit "no stable tag" error below could never
          # print. An empty result is a real answer for both, and each is handled as one.
          latest_stable_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -z "$latest_stable_tag" ]]; then
            echo "::error::No stable release tag (v<major>.<minor>.<patch>) found; nightly has nothing to version off of." >&2
            exit 1
          fi
          latest_stable_version="${latest_stable_tag#v}"

          newest_nightly_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"

          build_needed=true
          if [[ "${{ github.event_name }}" == "schedule" && -n "$newest_nightly_tag" ]]; then
            # A manual workflow_dispatch is an explicit request to rebuild the current commit even
            # if a nightly for it already exists, so this skip check only applies to the schedule
            # trigger. Comparing the nightly tag's commit to HEAD (not just "does today's tag
            # exist") means a scheduled run on a quiet day, where main hasn't moved since the last
            # nightly, doesn't publish a duplicate build of the same commit.
            if [[ "$(git rev-list -n1 "$newest_nightly_tag")" == "$(git rev-parse HEAD)" ]]; then
              build_needed=false
              echo "Newest nightly tag $newest_nightly_tag already points at HEAD; skipping scheduled rebuild."
            fi
          fi
          echo "build-needed=$build_needed" >> "$GITHUB_OUTPUT"

          # One UTC timestamp is both the version's fourth component and the build number. Minute
          # precision rather than a plain date because two nightlies can be cut on the same day
          # (a manual dispatch after the scheduled run): sharing a marketing version would let
          # Sparkle install the second build while the daemon, which compares marketing versions
          # to decide whether a newer build is staged, saw no change and kept running the first
          # build's binary until some later restart.
          stamp="$(date -u +%Y%m%d%H%M)"
          version="${latest_stable_version}.${stamp}"
          build="$stamp"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release-tag=v$version" >> "$GITHUB_OUTPUT"
          echo "stable-version=$latest_stable_version" >> "$GITHUB_OUTPUT"

  nightly:
    needs: plan
    if: ${{ needs.plan.outputs.build-needed == 'true' }}
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      channel: nightly
      version: ${{ needs.plan.outputs.version }}
      build: ${{ needs.plan.outputs.build }}
      release-tag: ${{ needs.plan.outputs.release-tag }}

  # TestFlight build of the same commit, in parallel with the macOS build — independent so a
  # failure on one side still ships the other. App Store Connect caps CFBundleShortVersionString
  # at three numeric components, so the iOS nightly cannot carry the 4-component nightly version;
  # it uploads as the latest stable marketing version with the nightly timestamp as its build
  # number, which keeps every upload unique and ordered inside that version's TestFlight group.
  ios:
    needs: plan
    if: ${{ needs.plan.outputs.build-needed == 'true' }}
    uses: ./.github/workflows/ios-release.yml
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.stable-version }}
      build: ${{ needs.plan.outputs.build }}

  # Nightly prereleases accumulate one per day forever without this: keep only the newest 7 so the
  # releases page and Firebase/GitHub storage don't grow unbounded.
  prune:
    needs: nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete nightly prereleases beyond the newest 7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `|| true` for the same reason as the plan job: no matching tags is an answer, not a
          # failure, and grep's exit 1 would otherwise kill the step under pipefail.
          nightly_tags="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
          stale_tags="$(printf '%s\n' "$nightly_tags" | head -n -7)"

          if [[ -z "$stale_tags" ]]; then
            echo "7 or fewer nightly tags exist; nothing to prune."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            # Only ever delete a release that is (a) tagged with the 4-component nightly pattern
            # and (b) actually marked prerelease. This is what keeps a stable release — which can
            # never match the 4-component pattern per release.yml's tag trigger exclusion — from
            # ever being reachable by this loop, even if the tag list above were ever wrong.
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping $tag: does not match the 4-component nightly tag pattern." >&2
              continue
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "Skipping $tag: no matching GitHub release (tag without a release)."
              continue
            fi
            is_prerelease="$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)"
            if [[ "$is_prerelease" != "true" ]]; then
              echo "Skipping $tag: release exists but is not marked prerelease." >&2
              continue
            fi
            echo "Pruning nightly release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$stale_tags"
