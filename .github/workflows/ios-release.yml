# Build, sign, and upload the Spaces iOS app to App Store Connect (TestFlight).
#
# Triggers:
#   - push a tag matching v* (e.g. v0.3.0): the same tag that cuts a macOS release
#     also uploads a matching iOS build.
#   - workflow_dispatch with a required `version` input: cut a TestFlight-only build
#     from a branch without tagging a public macOS release.
#   - workflow_call from nightly.yml, which passes the latest stable marketing
#     version plus the nightly timestamp as the build number.
#
# The build number is GITHUB_RUN_NUMBER only when no `build` input is supplied (tag
# push and workflow_dispatch); a workflow_call supplies it.
#
# Signing imports two long-lived certificates from secrets into a temporary keychain,
# the same shape release-build.yml uses for the macOS Developer ID certificate.
# xcodebuild still runs with -allowProvisioningUpdates and an App Store Connect API key
# so it can create and refresh *provisioning profiles*, which Apple does not cap, but it
# finds both signing identities already present and mints no certificate.
#
# Both are needed because the two build phases sign with different identities. The target
# signs automatically, so `xcodebuild archive` signs the archive for *development* and
# `-exportArchive` re-signs it for *distribution*. Supplying only the distribution half
# left the archive asking Apple for a development certificate on every run, which is
# exactly what the log showed:
#
#     Signing Identity: "Apple Development: Created via API"
#
# Forcing the archive onto the distribution identity instead is not an option: with
# automatic signing, a manually specified CODE_SIGN_IDENTITY makes xcodebuild fail during
# provisioning-input gathering with "automatically signed for development, but a
# conflicting code signing identity Apple Distribution has been manually specified".
#
# Why storing them matters: a certificate is bound to the private key that generated its
# CSR, and a runner's keychain is destroyed with the runner, so every minted certificate
# was orphaned the moment the run ended — unusable by anyone, since its key no longer
# existed, but still counted against Apple's per-team cap. Nine releases exhausted it, and
# the archive step then failed with "Your account has reached the maximum number of
# certificates" on tags whose commits had every check green.
#
# Renewing: both are valid for one year. Export fresh .p12 bundles (certificate plus
# private key) before they expire and update the four secrets; docs/dev.md has the
# procedure.
#
# Required secrets:
#   APP_STORE_CONNECT_KEY_ID          - App Store Connect API key identifier.
#   APP_STORE_CONNECT_ISSUER_ID       - App Store Connect API key issuer identifier.
#   APP_STORE_CONNECT_API_KEY_P8      - Raw contents of the App Store Connect API .p8 key.
#   IOS_CODESIGN_CERTIFICATE_P12      - Base64 Apple Distribution .p12 (certificate + key).
#   IOS_CODESIGN_CERTIFICATE_PASSWORD - Password used when exporting that .p12.
#   IOS_CODESIGN_DEV_CERTIFICATE_P12  - Base64 Apple Development .p12 (certificate + key).
#   IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD - Password used when exporting that .p12.

name: iOS Release

on:
  push:
    tags:
      - "v*"
      # Nightlies get their TestFlight build through nightly.yml calling this workflow
      # directly with an App-Store-Connect-compatible version, so the 4-component
      # nightly tag must stay out of the tag path — its 4-component marketing version
      # would be rejected at upload.
      - "!v*.*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to stamp and upload (e.g. 1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: >-
          Marketing version to stamp (e.g. 0.5.1). App Store Connect caps
          CFBundleShortVersionString at three numeric components, which is why the
          nightly caller passes the latest stable version rather than the
          4-component nightly version.
        required: true
        type: string
      build:
        description: "CFBundleVersion for the build (e.g. the nightly's UTC YYYYMMDDHHMM stamp)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Setup terminal build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh --publish-missing

      - name: Resolve version and build
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_INPUT: ${{ inputs.build }}
        run: |
          # `inputs` carries the workflow_call or workflow_dispatch values; both are empty on a
          # tag push. github.event_name cannot distinguish these cases here: inside a reusable
          # workflow it reports the caller's event (e.g. schedule), not workflow_call.
          if [[ -n "$VERSION_INPUT" ]]; then
            version="$VERSION_INPUT"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$BUILD_INPUT" ]]; then
            build="$BUILD_INPUT"
          else
            build="${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"

      - name: Sync app version metadata
        run: |
          scripts/sync-app-version.sh \
            --short "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build }}"

      - name: Validate signing configuration
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.IOS_CODESIGN_CERTIFICATE_P12 }}
          IOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CODESIGN_CERTIFICATE_PASSWORD }}
          IOS_CODESIGN_DEV_CERTIFICATE_P12: ${{ secrets.IOS_CODESIGN_DEV_CERTIFICATE_P12 }}
          IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APP_STORE_CONNECT_KEY_ID" ]]; then
            echo "::error::Missing required secret APP_STORE_CONNECT_KEY_ID." >&2
            exit 1
          fi
          if [[ -z "$APP_STORE_CONNECT_ISSUER_ID" ]]; then
            echo "::error::Missing required secret APP_STORE_CONNECT_ISSUER_ID." >&2
            exit 1
          fi
          if [[ -z "$APP_STORE_CONNECT_API_KEY_P8" ]]; then
            echo "::error::Missing required secret APP_STORE_CONNECT_API_KEY_P8." >&2
            exit 1
          fi
          if [[ -z "$IOS_CODESIGN_CERTIFICATE_P12" ]]; then
            echo "::error::Missing required secret IOS_CODESIGN_CERTIFICATE_P12. Set it to the base64-encoded Apple Distribution .p12 bundle." >&2
            exit 1
          fi
          if [[ -z "$IOS_CODESIGN_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Missing required secret IOS_CODESIGN_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          if [[ -z "$IOS_CODESIGN_DEV_CERTIFICATE_P12" ]]; then
            echo "::error::Missing required secret IOS_CODESIGN_DEV_CERTIFICATE_P12. Set it to the base64-encoded Apple Development .p12 bundle." >&2
            exit 1
          fi
          if [[ -z "$IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Missing required secret IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi

      - name: Import signing certificates
        env:
          IOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.IOS_CODESIGN_CERTIFICATE_P12 }}
          IOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CODESIGN_CERTIFICATE_PASSWORD }}
          IOS_CODESIGN_DEV_CERTIFICATE_P12: ${{ secrets.IOS_CODESIGN_DEV_CERTIFICATE_P12 }}
          IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/ios-codesign.keychain-db"
          keychain_password="$(uuidgen)"
          distribution_path="$RUNNER_TEMP/ios-codesign-distribution.p12"
          development_path="$RUNNER_TEMP/ios-codesign-development.p12"

          echo "$IOS_CODESIGN_CERTIFICATE_P12" | base64 -D -o "$distribution_path"
          echo "$IOS_CODESIGN_DEV_CERTIFICATE_P12" | base64 -D -o "$development_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$distribution_path" -k "$keychain_path" -P "$IOS_CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$development_path" -k "$keychain_path" -P "$IOS_CODESIGN_DEV_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain_path"

          # Fail here rather than inside xcodebuild if a .p12 carried no usable identity (a
          # certificate exported without its private key is the common mistake). Both halves are
          # asserted because a missing one is silent: xcodebuild would ask Apple for whichever
          # identity it could not find and reintroduce the per-run certificate leak these stored
          # certificates exist to stop, while the run still reported success. -v lists only valid
          # identities, so an expired certificate fails here too.
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          echo "$identities"
          for required in "Apple Distribution" "Apple Development"; do
            if ! grep -q "$required" <<<"$identities"; then
              echo "::error::No valid $required signing identity in the imported keychain. Export that .p12 with its private key." >&2
              exit 1
            fi
          done

          # A usable identity is not necessarily this project's identity: a maintainer on more
          # than one Apple team can export a perfectly valid certificate belonging to another,
          # which the check above accepts and Xcode then cannot use, so it asks Apple for one it
          # can and the leak resumes silently.
          #
          # The team is read from the certificate's organizational unit rather than its common
          # name. A distribution certificate's common name ends in the team id, but a development
          # certificate's carries a per-member identifier shared by every development certificate
          # that member holds -- "Apple Development: Name (K32PW8N4HR)" against team BEMDA62NB6 --
          # so matching the common name would reject the correct certificate and fail every
          # release. The organizational unit carries the team for both kinds.
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :teamID' apps/ios/ExportOptions.plist)"
          cert_dir="$RUNNER_TEMP/imported-certs"
          mkdir -p "$cert_dir"
          security find-certificate -a -p "$keychain_path" > "$cert_dir/all.pem"
          awk -v d="$cert_dir" '/-----BEGIN CERTIFICATE-----/{n++} n{print > (d "/cert-" n ".pem")}' "$cert_dir/all.pem"

          for required in "Apple Distribution" "Apple Development"; do
            found=0
            for certificate in "$cert_dir"/cert-*.pem; do
              [ -f "$certificate" ] || continue
              subject="$(openssl x509 -in "$certificate" -noout -subject -nameopt sep_multiline,utf8 2>/dev/null)"
              if grep -q "CN=$required:" <<<"$subject" && grep -q "OU=$team_id\$" <<<"$subject"; then
                found=1
                break
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "::error::The imported $required certificate does not belong to team $team_id. Export it from the Spaces team." >&2
              exit 1
            fi
          done

      - name: Write App Store Connect API key
        id: asc_key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/asc_api_key.p8"
          (umask 077; printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path")
          chmod 600 "$key_path"
          echo "key_path=${key_path}" >> "$GITHUB_OUTPUT"

      - name: Archive iOS app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          archive_log="$RUNNER_TEMP/archive.log"

          xcodebuild archive \
            -project apps/ios/SpacesMobile.xcodeproj \
            -scheme SpacesMobile \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/SpacesMobile.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.key_path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee "$archive_log"

          # Apple names a certificate minted through the App Store Connect API "Created via
          # API", so its appearance as the signing identity means xcodebuild did not use an
          # imported certificate and asked for a new one. That certificate is orphaned the
          # moment this runner is destroyed -- its private key never leaves the machine -- and
          # counts against the per-team cap until revoked, which is what exhausted the cap and
          # began failing releases.
          #
          # The import step cannot catch this. It proves both identities are in the keychain,
          # not that xcodebuild chose them, and every way it could still mint -- a toolchain
          # bump changing identity selection, a signing setting added to the project, a profile
          # the certificate does not match -- produces a green release that leaks. Without this,
          # such a regression stays invisible until the cap fills a few releases later.
          if grep -q "Created via API" "$archive_log"; then
            echo "::error::The archive signed with a certificate Apple minted for this run rather than an imported one, which leaks a certificate against the team cap. Signing identity reported below." >&2
            grep "Signing Identity" "$archive_log" >&2 || true
            exit 1
          fi

      - name: Export and upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SpacesMobile.xcarchive" \
            -exportOptionsPlist apps/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.key_path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload xcarchive for debugging
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SpacesMobile-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}.xcarchive
          path: ${{ runner.temp }}/SpacesMobile.xcarchive
          if-no-files-found: warn
