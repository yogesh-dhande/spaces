name: Sync GhosttyKit Release

on:
  schedule:
    - cron: "18 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update pinned GhosttyKit release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/sync-ghosttykit-release.sh
          scripts/sync-ghosttykit-release.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Sync GhosttyKit release tag
          title: Sync GhosttyKit release tag
          body: |
            Update the pinned `GhosttyKit` release tag to the latest published build from the Spaces-owned fork.

            The fork is expected to auto-sync with upstream Ghostty separately; this PR keeps the app repo on the latest published build artifact.
          branch: sync-ghosttykit-release
          delete-branch: true
