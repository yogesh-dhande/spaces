name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ghostty-artifacts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: macos-15
    concurrency:
      group: ghostty-artifacts-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Publish missing Ghostty artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh --publish-missing

  verify:
    needs: publish-ghostty-artifacts
    if: ${{ always() && github.event_name != 'push' && (needs['publish-ghostty-artifacts'].result == 'success' || needs['publish-ghostty-artifacts'].result == 'skipped') }}
    runs-on: macos-15
    concurrency:
      group: pr-checks-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup terminal build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh

      - name: Install website dependencies
        working-directory: apps/web
        run: npm ci

      - name: Resolve SwiftPM dependencies
        run: scripts/swiftpm.sh package resolve

      - name: Run Swift verification
        run: scripts/verify.sh

      - name: Build static website
        working-directory: apps/web
        run: npm run build

  linux-spacesd-artifact:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker-platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            docker-platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build and smoke Linux spacesd artifact
        run: |
          docker run --rm --platform ${{ matrix.docker-platform }} \
            -v "$PWD":/workspace \
            -w /workspace \
            swift:6.2-noble \
            bash -lc 'apt-get update && apt-get install -y curl git xz-utils python3 pkg-config libsqlite3-dev libssl-dev openssl coreutils && apps/macos/scripts/build_linux_spacesd_artifact.sh --arch ${{ matrix.arch }}'

      - name: Upload Linux spacesd artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacesd-ubuntu-24.04-${{ matrix.arch }}
          path: |
            dist/linux/spacesd-ubuntu-24.04-${{ matrix.arch }}.tar.gz
            dist/linux/spacesd-ubuntu-24.04-${{ matrix.arch }}.tar.gz.sha256
