name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ghostty-artifacts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: macos-15
    concurrency:
      group: ghostty-artifacts-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Publish missing Ghostty artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh --publish-missing

  verify:
    needs: publish-ghostty-artifacts
    if: ${{ always() && github.event_name != 'push' && (needs['publish-ghostty-artifacts'].result == 'success' || needs['publish-ghostty-artifacts'].result == 'skipped') }}
    runs-on: macos-15
    concurrency:
      group: pr-checks-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup terminal build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh

      - name: Install website dependencies
        working-directory: apps/web
        run: npm ci

      - name: Resolve SwiftPM dependencies
        run: scripts/swiftpm.sh package resolve

      - name: Lint Swift sources
        run: scripts/lint.sh

      - name: Build macOS app and CLI
        run: scripts/swiftpm.sh build

      - name: Run Swift coverage suite
        run: scripts/coverage.sh

      - name: Build static website
        working-directory: apps/web
        run: npm run build
