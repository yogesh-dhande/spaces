name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ghostty-artifacts:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: macos-15
    concurrency:
      group: ghostty-artifacts-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Publish missing Ghostty artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh --publish-missing

  verify:
    needs: publish-ghostty-artifacts
    # Runs on pull requests AND pushes to main: a post-merge verify failure is the only signal
    # that main itself broke (e.g. a semantic conflict between two individually-green PRs).
    if: ${{ always() && (needs['publish-ghostty-artifacts'].result == 'success' || needs['publish-ghostty-artifacts'].result == 'skipped') }}
    runs-on: macos-15
    concurrency:
      group: pr-checks-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup terminal build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh

      - name: Install website dependencies
        working-directory: apps/web
        run: npm ci

      - name: Resolve SwiftPM dependencies
        run: scripts/swiftpm.sh package resolve

      - name: Run Swift verification
        # Step-scoped so a wedged verify fails through the normal path, which still uploads the
        # step's logs for diagnosis; a force-cancelled job discards them. Normal runs finish in
        # 13-16 minutes, so this only fires on a genuine hang the silence watchdog cannot see
        # (an unwrapped build phase, or output trickling under its threshold).
        timeout-minutes: 45
        run: scripts/verify.sh

      # A recurring CI-only SIGTRAP kills a test worker mid-run (so far always within
      # TerminalSessionPaneViewControllerTests) and has never reproduced locally; the macOS crash
      # report is the only artifact that can name the crashed frame.
      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.crash crash-reports/ 2>/dev/null || true
          ls -la crash-reports/

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-crash-reports
          path: crash-reports/
          if-no-files-found: ignore

      # The backgrounded iOS unit-test lane logs to this file instead of the terminal (see
      # verify.sh) so a hang there produces no console output at all; upload it on failure so a
      # silence-watchdog kill or a step timeout still leaves something to diagnose from.
      - name: Upload iOS verify lane log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-log
          path: apps/macos/.build/ios-verify.log
          if-no-files-found: ignore

      - name: Build static website
        working-directory: apps/web
        run: npm run build

  linux-spacesd-artifact:
    runs-on: ${{ matrix.runner }}
    # The x86_64 leg also runs the Linux unit-test lane after the artifact build; its SwiftPM
    # test build starts cold on a fresh runner, so the ceiling covers both phases.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker-platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            docker-platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build and smoke Linux spacesd artifact
        run: |
          docker run --rm --platform ${{ matrix.docker-platform }} \
            -v "$PWD":/workspace \
            -w /workspace \
            swift:6.2-noble \
            bash -lc 'apt-get update && apt-get install -y curl git xz-utils python3 pkg-config libsqlite3-dev libssl-dev openssl coreutils && apps/macos/scripts/build_linux_spacesd_artifact.sh --arch ${{ matrix.arch }}'

      # The artifact build above stages the Linux libghostty-vt into .local/ghosttyvt/lib-linux,
      # which is exactly what the unit lane needs; one architecture's run suffices for unit
      # coverage. The named volumes start empty on a fresh runner — the lane builds its own
      # test products into them.
      - name: Run Linux unit-test lane
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          docker run --rm --init --platform ${{ matrix.docker-platform }} \
            -v "$PWD":/workspace \
            -v spaces-linux-src:/root/src \
            -v spaces-linux-zig:/root/spaces-zig-cache \
            -v spaces-linux-test-build:/root/spaces-test-build \
            -e ZIG_LOCAL_CACHE_DIR=/root/spaces-zig-cache/local -e ZIG_GLOBAL_CACHE_DIR=/root/spaces-zig-cache/global \
            swift:6.2-noble \
            bash /workspace/apps/macos/scripts/run_linux_tests.sh

      - name: Upload Linux spacesd artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacesd-ubuntu-24.04-${{ matrix.arch }}
          path: |
            dist/linux/spacesd-ubuntu-24.04-${{ matrix.arch }}.tar.gz
            dist/linux/spacesd-ubuntu-24.04-${{ matrix.arch }}.tar.gz.sha256
