# Cut a Spaces release when a version tag is pushed.
#
# Trigger: push a tag matching v* (e.g. v0.3.0). Every tagged release is published as a GitHub
# prerelease and served on the pre-release update feed; it becomes the stable release when a
# maintainer unticks "Set as a pre-release" on it, which runs release-promote.yml.
#
# The actual build (signing, packaging, notarization, GitHub Release, Sparkle appcast, website
# deploy) lives in release-build.yml. See it for the required/optional secrets list.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # GitHub Actions expressions have no substring-trim function, so stripping the tag's leading "v"
  # needs a real shell step rather than an inline `${{ }}` expression. Kept as its own tiny job
  # (instead of a step inside `release`) so the version is computed once, in the open, before the
  # reusable workflow call below.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
      # run_number is the release pipeline's monotonic build counter, and Sparkle compares it to
      # decide whether an update is newer. This workflow is the caller, so github.run_number here
      # is this run's own number, not the reusable workflow's.
      build: ${{ github.run_number }}
      release-tag: ${{ github.ref_name }}
