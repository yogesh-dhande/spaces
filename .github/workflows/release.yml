# Cut a stable Spaces release when a version tag is pushed.
#
# Trigger: push a tag matching v* (e.g. v0.3.0), excluding the 4-component tags nightly.yml cuts
# (e.g. v0.5.1.202607250900). A stable tag like v0.5.1 has two dots and never matches a pattern that
# requires three, so a nightly release/tag can never re-enter the stable pipeline through this
# trigger.
#
# The actual build (signing, packaging, notarization, GitHub Release, Sparkle appcast, website
# deploy) lives in release-build.yml, a reusable workflow shared with nightly.yml so both channels
# run byte-for-byte the same body. See release-build.yml for the required/optional secrets list.

name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*.*.*.*"

permissions:
  contents: write

jobs:
  # GitHub Actions expressions have no substring-trim function, so stripping the tag's leading "v"
  # needs a real shell step rather than an inline `${{ }}` expression. Kept as its own tiny job
  # (instead of a step inside `release`) so the version is computed once, in the open, before the
  # reusable workflow call below.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      channel: stable
      version: ${{ needs.plan.outputs.version }}
      # run_number is the stable channel's monotonic build counter: this workflow is the caller,
      # so github.run_number here is this run's own number, not the reusable workflow's.
      build: ${{ github.run_number }}
      release-tag: ${{ github.ref_name }}
