# Build, sign, package, and publish a Spaces release when a version tag is pushed.
#
# Trigger: push a tag matching v* (e.g. v0.3.0)
#
# Optional secrets:
#   CODESIGN_IDENTITY - Developer ID Application certificate name for code signing.
#   CODESIGN_CERTIFICATE_P12 - Base64-encoded Developer ID Application .p12 certificate.
#   CODESIGN_CERTIFICATE_PASSWORD - Password for the .p12 certificate.
#   APPLE_ID          - Apple ID email for notarization (requires all three notarization secrets).
#   TEAM_ID           - Apple Developer Team ID for notarization.
#   APP_PASSWORD      - App-specific password for notarization.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Resolve SwiftPM dependencies
        run: scripts/swiftpm.sh package resolve

      - name: Build release
        run: scripts/swiftpm.sh build -c release

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate signing configuration
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          CODESIGN_CERTIFICATE_P12: ${{ secrets.CODESIGN_CERTIFICATE_P12 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "::error::Missing required secret CODESIGN_IDENTITY." >&2
            exit 1
          fi
          if [[ -z "$CODESIGN_CERTIFICATE_P12" ]]; then
            echo "::error::Missing required secret CODESIGN_CERTIFICATE_P12. Set it to the base64-encoded Developer ID Application .p12 certificate." >&2
            exit 1
          fi
          if [[ -z "$CODESIGN_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Missing required secret CODESIGN_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi

      - name: Import signing certificate
        env:
          CODESIGN_CERTIFICATE_P12: ${{ secrets.CODESIGN_CERTIFICATE_P12 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/codesign.p12"

          echo "$CODESIGN_CERTIFICATE_P12" | base64 -D -o "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Code sign binaries
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          scripts/codesign.sh \
            apps/macos/.build/release/SpacesApp \
            apps/macos/.build/release/spaces

      - name: Package DMG
        run: |
          scripts/create-dmg.sh \
            apps/macos/.build/release/SpacesApp \
            apps/macos/.build/release/spaces \
            ${{ steps.version.outputs.version }}
          dmg_name="Spaces-${{ steps.version.outputs.version }}.dmg"
          echo "DMG_NAME=$dmg_name" >> "$GITHUB_ENV"
          echo "DMG_PATH=dist/releases/${{ steps.version.outputs.version }}/$dmg_name" >> "$GITHUB_ENV"

      - name: Notarize (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        if: ${{ env.APPLE_ID != '' && env.TEAM_ID != '' && env.APP_PASSWORD != '' }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG_PATH" \
            --title "Spaces ${{ steps.version.outputs.version }}" \
            --generate-notes
