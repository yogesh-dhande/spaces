# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'scripts/stage-web-releases.sh'
      - '.github/workflows/firebase-hosting-merge.yml'
      - '.github/workflows/firebase-hosting-pull-request.yml'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The website prebuild stages both Sparkle feeds from GitHub release state with `gh`,
      # so the build needs a token even though it only reads public releases.
      - run: cd apps/web && npm ci && npm run build
        env:
          GH_TOKEN: ${{ github.token }}
      # Runs through the CLI so all three live-channel deploys share one deploy path and one rule
      # for the HTTP 400 "is the current active version" no-op. A deploy error fails this job, and
      # this workflow has no feed check behind it to catch one otherwise.
      - name: Deploy Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPACES_A1814 }}
        run: scripts/deploy-firebase-hosting.sh
