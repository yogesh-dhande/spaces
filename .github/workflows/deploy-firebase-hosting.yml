name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install website dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build static website
        working-directory: apps/web
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate deploy configuration
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing FIREBASE_PROJECT_ID secret." >&2
            exit 1
          fi
          if [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]; then
            echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER secret." >&2
            exit 1
          fi
          if [ -z "$GCP_SERVICE_ACCOUNT_EMAIL" ]; then
            echo "Missing GCP_SERVICE_ACCOUNT_EMAIL secret." >&2
            exit 1
          fi

      - name: Deploy Firebase Hosting
        working-directory: apps/web
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
