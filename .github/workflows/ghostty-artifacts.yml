name: Ghostty Artifacts

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghostty-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Resolve Ghostty artifact release
        id: ghostty
        run: |
          ghostty_sha="$(git -C apps/macos/vendor/ghostty rev-parse HEAD)"
          echo "sha=$ghostty_sha" >> "$GITHUB_OUTPUT"
          echo "tag=ghostty-artifacts-$ghostty_sha" >> "$GITHUB_OUTPUT"

      - name: Check for existing Ghostty artifact release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ghostty.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Ghostty artifact release already exists: ${{ steps.ghostty.outputs.tag }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        if: steps.existing.outputs.exists != 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Swift toolchain
        if: steps.existing.outputs.exists != 'true'
        run: |
          xcode-select -p
          xcrun swift --version
          swift --version

      - name: Build and package Ghostty artifacts
        if: steps.existing.outputs.exists != 'true'
        run: apps/macos/scripts/setup_ghostty.sh --build --strict --package "$RUNNER_TEMP/ghostty-artifacts"

      - name: Verify Ghostty artifact checksums
        if: steps.existing.outputs.exists != 'true'
        run: cd "$RUNNER_TEMP/ghostty-artifacts" && shasum -a 256 -c SHA256SUMS

      - name: Publish Ghostty artifact release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ steps.ghostty.outputs.tag }}"
          release_title="Ghostty artifacts ${{ steps.ghostty.outputs.sha }}"
          artifact_dir="$RUNNER_TEMP/ghostty-artifacts"
          assets=(
            "$artifact_dir/GhosttyKit.xcframework.tar.gz"
            "$artifact_dir/GhosttyKit-resources.tar.gz"
            "$artifact_dir/libghostty-vt.tar.gz"
            "$artifact_dir/manifest.json"
            "$artifact_dir/SHA256SUMS"
          )
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_title"
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            gh release create "$release_tag" "${assets[@]}" \
              --title "$release_title" \
              --notes "Prebuilt Ghostty artifacts for ${{ steps.ghostty.outputs.sha }}."
          fi
