# Build, sign, package, and publish a Spaces release.
#
# This is a reusable `workflow_call` workflow, not a trigger entry point. release.yml (tag push)
# is its caller and resolves the version/build/tag it hands in as inputs.
#
# Every release it publishes is a GitHub prerelease, served on the pre-release update feed at
# https://usespaces.dev/releases/prerelease/appcast.xml. A maintainer promotes one by editing the
# GitHub release and selecting "Latest", which runs release-promote.yml; that is the only thing
# that moves a build onto the stable feed. Nothing here ever claims `latest`.
#
# Required secrets:
#   CODESIGN_IDENTITY - Developer ID Application certificate name for code signing.
#   CODESIGN_CERTIFICATE_P12 - Base64-encoded Developer ID Application .p12 certificate.
#   CODESIGN_CERTIFICATE_PASSWORD - Password for the .p12 certificate.
#   SPARKLE_PUBLIC_ED_KEY - Public Sparkle EdDSA key embedded in the app bundle.
#   SPARKLE_PRIVATE_ED_KEY - Private Sparkle EdDSA key used for appcast signing.
#   REMOTE_ARTIFACT_PUBLIC_ED25519_KEY - Public Ed25519 key embedded for remote artifact manifest verification.
#   REMOTE_ARTIFACT_PRIVATE_ED25519_KEY - Private Ed25519 key used for remote artifact manifest signing.
#   FIREBASE_SERVICE_ACCOUNT_SPACES_A1814 - Firebase Hosting service account JSON.
#
# Optional secrets:
#   APPLE_ID          - Apple ID email for notarization (requires all three notarization secrets).
#   TEAM_ID           - Apple Developer Team ID for notarization.
#   APP_PASSWORD      - App-specific password for notarization.

name: Release Build

on:
  workflow_call:
    inputs:
      version:
        description: "Spaces version, e.g. 0.5.2"
        required: true
        type: string
      build:
        description: "CFBundleVersion for this build (the caller's run number)"
        required: true
        type: string
      release-tag:
        description: "GitHub release tag to create, e.g. v0.5.2"
        required: true
        type: string

permissions:
  contents: write

env:
  # The one Sparkle feed URL baked into every Spaces build. It is the stable feed; a Mac opts into
  # the pre-release feed at runtime through the "Receive pre-release updates" setting, which
  # overrides this URL in the app rather than requiring a differently built binary.
  SPARKLE_FEED_URL: https://usespaces.dev/releases/appcast.xml

jobs:
  linux-spacesd-artifact:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker-platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            docker-platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Sync release metadata
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          REMOTE_ARTIFACT_PUBLIC_ED25519_KEY: ${{ secrets.REMOTE_ARTIFACT_PUBLIC_ED25519_KEY }}
        run: |
          scripts/sync-app-version.sh \
            --short "${{ inputs.version }}" \
            --build "${{ inputs.build }}" \
            --feed-url "$SPARKLE_FEED_URL" \
            --public-ed-key "$SPARKLE_PUBLIC_ED_KEY" \
            --remote-artifact-public-ed-key "$REMOTE_ARTIFACT_PUBLIC_ED25519_KEY"

      - name: Build and smoke Linux spacesd artifact
        run: |
          set -euo pipefail
          builder_image="$(apps/macos/scripts/ensure_linux_builder_image.sh --arch ${{ matrix.arch }})"
          docker run --rm --platform ${{ matrix.docker-platform }} \
            -v "$PWD":/workspace \
            -w /workspace \
            "$builder_image" \
            bash -lc 'apps/macos/scripts/build_linux_spacesd_artifact.sh --arch ${{ matrix.arch }}'

      - name: Upload Linux spacesd artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacesd-ubuntu-24.04-${{ matrix.arch }}
          path: |
            dist/linux/spacesd-ubuntu-24.04-${{ matrix.arch }}.tar.gz
            dist/linux/spacesd-ubuntu-24.04-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: linux-spacesd-artifact
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Setup terminal build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: apps/macos/scripts/ensure_ghostty_artifacts.sh --publish-missing

      - name: Resolve SwiftPM dependencies
        run: scripts/swiftpm.sh package resolve

      - name: Validate signing configuration
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          CODESIGN_CERTIFICATE_P12: ${{ secrets.CODESIGN_CERTIFICATE_P12 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          REMOTE_ARTIFACT_PUBLIC_ED25519_KEY: ${{ secrets.REMOTE_ARTIFACT_PUBLIC_ED25519_KEY }}
          REMOTE_ARTIFACT_PRIVATE_ED25519_KEY: ${{ secrets.REMOTE_ARTIFACT_PRIVATE_ED25519_KEY }}
          FIREBASE_SERVICE_ACCOUNT_SPACES_A1814: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPACES_A1814 }}
        run: |
          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "::error::Missing required secret CODESIGN_IDENTITY." >&2
            exit 1
          fi
          if [[ -z "$CODESIGN_CERTIFICATE_P12" ]]; then
            echo "::error::Missing required secret CODESIGN_CERTIFICATE_P12. Set it to the base64-encoded Developer ID Application .p12 certificate." >&2
            exit 1
          fi
          if [[ -z "$CODESIGN_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Missing required secret CODESIGN_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "::error::Missing required secret SPARKLE_PUBLIC_ED_KEY." >&2
            exit 1
          fi
          if [[ -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "::error::Missing required secret SPARKLE_PRIVATE_ED_KEY." >&2
            exit 1
          fi
          if [[ -z "$REMOTE_ARTIFACT_PUBLIC_ED25519_KEY" ]]; then
            echo "::error::Missing required secret REMOTE_ARTIFACT_PUBLIC_ED25519_KEY." >&2
            exit 1
          fi
          if [[ -z "$REMOTE_ARTIFACT_PRIVATE_ED25519_KEY" ]]; then
            echo "::error::Missing required secret REMOTE_ARTIFACT_PRIVATE_ED25519_KEY." >&2
            exit 1
          fi
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT_SPACES_A1814" ]]; then
            echo "::error::Missing required secret FIREBASE_SERVICE_ACCOUNT_SPACES_A1814." >&2
            exit 1
          fi

      - name: Import signing certificate
        env:
          CODESIGN_CERTIFICATE_P12: ${{ secrets.CODESIGN_CERTIFICATE_P12 }}
          CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/codesign.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_path="$RUNNER_TEMP/codesign.p12"

          echo "$CODESIGN_CERTIFICATE_P12" | base64 -D -o "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CODESIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Sync release metadata
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          REMOTE_ARTIFACT_PUBLIC_ED25519_KEY: ${{ secrets.REMOTE_ARTIFACT_PUBLIC_ED25519_KEY }}
        run: |
          scripts/sync-app-version.sh \
            --short "${{ inputs.version }}" \
            --build "${{ inputs.build }}" \
            --feed-url "$SPARKLE_FEED_URL" \
            --public-ed-key "$SPARKLE_PUBLIC_ED_KEY" \
            --remote-artifact-public-ed-key "$REMOTE_ARTIFACT_PUBLIC_ED25519_KEY"

      - name: Build release
        run: scripts/swiftpm.sh build -c release --arch arm64 --arch x86_64

      - name: Code sign binaries
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          scripts/codesign.sh \
            apps/macos/.build/apple/Products/Release/SpacesApp \
            apps/macos/.build/apple/Products/Release/spaces \
            apps/macos/.build/apple/Products/Release/spacesd

      - name: Package DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          scripts/create-dmg.sh \
            apps/macos/.build/apple/Products/Release/SpacesApp \
            apps/macos/.build/apple/Products/Release/spaces \
            apps/macos/.build/apple/Products/Release/spacesd \
            ${{ inputs.version }}
          dmg_name="Spaces-${{ inputs.version }}.dmg"
          echo "DMG_NAME=$dmg_name" >> "$GITHUB_ENV"
          echo "DMG_PATH=dist/releases/${{ inputs.version }}/$dmg_name" >> "$GITHUB_ENV"

      - name: Package Sparkle archive
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          scripts/create-sparkle-archive.sh \
            apps/macos/.build/apple/Products/Release/SpacesApp \
            apps/macos/.build/apple/Products/Release/spaces \
            apps/macos/.build/apple/Products/Release/spacesd \
            ${{ inputs.version }}
          zip_name="Spaces-${{ inputs.version }}.zip"
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"
          echo "ZIP_PATH=dist/releases/${{ inputs.version }}/$zip_name" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        if: ${{ env.APPLE_ID != '' && env.TEAM_ID != '' && env.APP_PASSWORD != '' }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Verify release artifacts
        run: scripts/verify-release-artifacts.sh --require-notarization "$DMG_PATH"

      - name: Download Linux x86_64 spacesd artifact
        uses: actions/download-artifact@v4
        with:
          name: spacesd-ubuntu-24.04-x86_64
          path: dist/remote

      - name: Download Linux arm64 spacesd artifact
        uses: actions/download-artifact@v4
        with:
          name: spacesd-ubuntu-24.04-arm64
          path: dist/remote

      - name: Verify remote spacesd artifacts
        run: |
          cd dist/remote
          shasum -a 256 -c spacesd-ubuntu-24.04-x86_64.tar.gz.sha256
          shasum -a 256 -c spacesd-ubuntu-24.04-arm64.tar.gz.sha256
          tar -tzf spacesd-ubuntu-24.04-x86_64.tar.gz >/dev/null
          tar -tzf spacesd-ubuntu-24.04-arm64.tar.gz >/dev/null

      - name: Install remote artifact signing dependency
        run: python3 -m pip install --user --break-system-packages cryptography

      - name: Sign remote artifact manifest
        env:
          REMOTE_ARTIFACT_PRIVATE_ED25519_KEY: ${{ secrets.REMOTE_ARTIFACT_PRIVATE_ED25519_KEY }}
        run: scripts/create-remote-artifact-manifest.sh "${{ inputs.version }}" "${{ inputs.release-tag }}" dist/remote

      # Generate the appcast before creating the GitHub Release: the site build downloads
      # appcast.xml and the Sparkle zip back out of the release it is about to publish, so the
      # release (and the appcast asset on it) must exist first.
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: scripts/publish-sparkle-appcast.sh ${{ inputs.version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_title="Spaces ${{ inputs.version }}"
          release_assets=(
            "$DMG_PATH"
            "$ZIP_PATH"
            "dist/updates/appcast.xml"
            "dist/remote/spacesd-ubuntu-24.04-x86_64.tar.gz"
            "dist/remote/spacesd-ubuntu-24.04-x86_64.tar.gz.sha256"
            "dist/remote/spacesd-ubuntu-24.04-arm64.tar.gz"
            "dist/remote/spacesd-ubuntu-24.04-arm64.tar.gz.sha256"
            "dist/remote/spaces-remote-artifacts.json"
            "dist/remote/spaces-remote-artifacts.json.sig"
          )
          # Every tagged build is published as a prerelease, and `--latest` is never passed: the
          # `latest` release, which `releases/latest/download` and therefore the stable Sparkle
          # feed resolve through, must keep pointing at the last promoted build until a maintainer
          # promotes this one by selecting "Latest" on it (`gh release edit <tag> --prerelease=false
          # --latest`), at which point release-promote.yml redeploys the site from it.
          #
          # --target pins the tag to the commit this run built rather than the default branch tip.
          if gh release view "${{ inputs.release-tag }}" >/dev/null 2>&1; then
            # Re-running a run that failed after creating the release: refresh the assets in place.
            # The prerelease flag is deliberately not touched here, so a re-run cannot push an
            # already-promoted release back onto the pre-release feed.
            gh release upload "${{ inputs.release-tag }}" "${release_assets[@]}" --clobber
          else
            gh release create "${{ inputs.release-tag }}" "${release_assets[@]}" \
              --title "$release_title" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --generate-notes
          fi

      # The site build's prebuild restages both Sparkle feeds from GitHub release state, so this
      # deploy is what puts the release just published onto the live pre-release feed.
      - name: Build website with staged Sparkle feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Deploy Firebase Hosting
        # The verification step below is the gate: a live-channel deploy of an unchanged site
        # answers HTTP 400 "is the current active version", which is a no-op rather than a failure.
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPACES_A1814 }}
          channelId: live
          projectId: spaces-a1814

      - name: Confirm the pre-release feed serves this release
        run: scripts/verify-live-appcast.sh https://usespaces.dev/releases/prerelease/appcast.xml "${{ inputs.version }}"
