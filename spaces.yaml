version: 1
setup_script: |
  cp $SPACES_PROJECT_DIR/.env .env
  git submodule update --init --recursive
  export SPACES_GHOSTTY_CACHE_DIR="$SPACES_PROJECT_DIR/apps/macos/.local/ghostty-cache"
  apps/macos/scripts/setup_ghostty.sh
  (cd apps/web && npm i)
stop_script: ''
ports:
- name: PORT
processes:
- name: npm:dev
  command: cd apps/web && npm run dev
  on_exit: none
  execution_mode: direct
browser_sessions:
- name: web
  url: http://localhost:$PORT
agent_launchers:
- name: codex
  command: codex --yolo
