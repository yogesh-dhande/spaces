version: 1
setup_script: |
  cp $SPACES_PROJECT_DIR/.env .env
  git submodule update --init --recursive
  apps/macos/scripts/setup_ghostty.sh
  apps/macos/scripts/setup_caddy.sh
  (cd apps/web && npm i)
stop_script: ''
services:
- web
processes:
- name: npm:dev
  command: cd apps/web && PORT=$SPACES_WEB_PORT npm run dev
  on_exit: none
  execution_mode: direct
browser_sessions:
- name: web
  url: $SPACES_WEB_URL
agent_launchers:
- name: codex
  command: codex --yolo
