[project]
name = "spaces-e2e-demo"
version = "0.1.0"
description = "Permanent demo servers for the Spaces real-system e2e harness."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spaces-e2e-demo = "spaces_e2e_demo.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
