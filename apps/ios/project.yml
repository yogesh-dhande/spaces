name: SpacesMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  SpacesPackage:
    path: ../macos
targets:
  SpacesMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "DemoRecording/**"
      # Folder reference: the demo recording must keep its grids/<cols>x<rows>/ directory
      # structure in the app bundle (group resources copy flat, and the per-grid files share
      # names), and re-recording must not require regenerating the project.
      - path: Resources/DemoRecording
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../macos/.local/ghosttykit/Resources/ghostty
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile
        PRODUCT_NAME: SpacesMobile
        DEVELOPMENT_TEAM: BEMDA62NB6
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - package: SpacesPackage
        product: spacesdevicecore
      - package: SpacesPackage
        product: spacesterminalcore
      - package: SpacesPackage
        product: spacesterminalmobileghostty
  SpacesMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile.tests
    dependencies:
      - target: SpacesMobile
      - package: SpacesPackage
        product: spacesterminalcore
      - package: SpacesPackage
        product: spacesterminalmobileghostty
  SpacesMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile.uitests
        TEST_TARGET_NAME: SpacesMobile
    dependencies:
      - target: SpacesMobile
schemes:
  SpacesMobile:
    build:
      targets:
        SpacesMobile: all
        SpacesMobileTests: [test]
        SpacesMobileUITests: [test]
    run:
      storeKitConfiguration: SpacesMobile.storekit
    test:
      targets:
        - SpacesMobileTests
        - SpacesMobileUITests
