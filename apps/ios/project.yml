name: SpacesMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  SpacesPackage:
    path: ../macos
targets:
  SpacesMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Assets.xcassets
        buildPhase: resources
      - path: ../macos/.local/ghosttykit/Resources/ghostty
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yogeshdhande.spacesmobile
        PRODUCT_NAME: SpacesMobile
        DEVELOPMENT_TEAM: BEMDA62NB6
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaces
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Spaces connects to your Mac's first-party terminal bridge.
        INFOPLIST_KEY_NSBonjourServices:
          - _spaces-mobile._tcp.
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - package: SpacesPackage
        product: spacesmobilecore
      - package: SpacesPackage
        product: spacesterminalcore
      - package: SpacesPackage
        product: spacesterminalmobileghostty
  SpacesMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: com.yogeshdhande.spacesmobile.tests
    dependencies:
      - package: SpacesPackage
        product: spacesterminalcore
      - package: SpacesPackage
        product: spacesterminalmobileghostty
  SpacesMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: com.yogeshdhande.spacesmobile.uitests
        TEST_TARGET_NAME: SpacesMobile
    dependencies:
      - target: SpacesMobile
schemes:
  SpacesMobile:
    build:
      targets:
        SpacesMobile: all
        SpacesMobileTests: all
        SpacesMobileUITests: all
    test:
      targets:
        - SpacesMobileTests
        - SpacesMobileUITests
