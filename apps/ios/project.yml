name: SpacesMobile
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  # Scheme-relative paths (the StoreKit configuration reference) must resolve from the
  # repo-root Spaces.xcworkspace, which is how the project is opened in Xcode. The XcodeGen
  # default ("../../") only resolves when the .xcodeproj is opened standalone; with the
  # workspace open, Xcode shows the StoreKit config in red and silently runs without it.
  schemePathPrefix: "../apps/ios/"
packages:
  SpacesPackage:
    path: ../macos
# The StoreKit configuration must be a project navigator member (not part of any build phase)
# for Xcode's scheme Options dropdown to list it and resolve the scheme's reference to it.
fileGroups:
  - SpacesMobile.storekit
targets:
  SpacesMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "DemoRecording/**"
      # Folder reference: the demo recording must keep its grids/<cols>x<rows>/ directory
      # structure in the app bundle (group resources copy flat, and the per-grid files share
      # names), and re-recording must not require regenerating the project.
      - path: Resources/DemoRecording
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../macos/.local/ghosttykit/Resources/ghostty
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile
        PRODUCT_NAME: SpacesMobile
        DEVELOPMENT_TEAM: BEMDA62NB6
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        DEVELOPMENT_ASSET_PATHS: ""
        # libghostty-vt, linked into the app. The daemon and the Mac app dlopen the shared library next
        # to their binary at runtime; iOS cannot dlopen a library outside the app bundle, so the phone
        # links the xcframework's iOS slice into the app image and `ghosttyvtshim` resolves its symbols
        # there (see SPACES_GHOSTTY_VT_STATIC_LINK in ghosttyvtshim.c).
        # The Ghostty artifact set ships arm64-only iOS slices, so the simulator build links on Apple
        # Silicon only (CI runs on macos-15 Apple Silicon runners) and the x86_64 simulator slice is
        # excluded rather than left to fail on an archive that has no x86_64 members. An Intel-hosted
        # simulator build needs an x86_64 simulator slice in the artifact; that is a Ghostty artifact
        # build change, not an app setting.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        GHOSTTY_VT_LIBRARY[sdk=iphonesimulator*]: "$(SRCROOT)/../macos/.local/ghosttyvt/lib/ghostty-vt.xcframework/ios-arm64-simulator/libghostty-vt-fat.a"
        GHOSTTY_VT_LIBRARY[sdk=iphoneos*]: "$(SRCROOT)/../macos/.local/ghosttyvt/lib/ghostty-vt.xcframework/ios-arm64/libghostty-vt-fat.a"
        # `-force_load` pulls every member of the archive in, because nothing on the Swift side
        # references them. `-u` then names each one a dead-strip root. Both are needed and neither
        # substitutes for the other: this flag is the archive's only appearance on the link line, so
        # without `-force_load` the members are never loaded and the roots below are plain undefined
        # symbols; and without `-u` the dead-code stripping that Release and archive builds enable
        # removes every one of them again (a Release executable relinked without these roots drops all
        # of them from its export trie), leaving a shipped app whose `dlsym` lookups all fail and whose
        # scrollback replay never runs.
        # Pulling the whole archive in is safe beside GhosttyKit's `libghostty-internal.a`, which
        # embeds the same upstream support objects (wuffs, simdutf, highway, compiler-rt) under the
        # same member names. Each of those members defines an identical set of strong external symbols
        # in both archives, so once the force-loaded copies are in there is nothing left for the linker
        # to pull GhosttyKit's copies for, and the `__ubsan_handle_*` and `memset` definitions the two
        # appear to share are private external in both, which the linker scopes to the object file that
        # defines them. Neither archive defines the other's entry points: GhosttyKit's iOS slice carries
        # the embedded-app API, not the `libghostty-vt` API this list names.
        # The shim resolves these by name, which is not a reference any linker can see, so this list is
        # the reference. Keep it in step with the symbols `spaces_ghostty_vt_load_symbols` binds. The two
        # names its ABI-generation probe looks for belong to a library generation this build rejects, so
        # they stay off this list: naming a symbol the archive does not define fails the link.
        OTHER_LDFLAGS:
          - "-Wl,-force_load,$(GHOSTTY_VT_LIBRARY)"
          - "-Wl,-u,_ghostty_terminal_new"
          - "-Wl,-u,_ghostty_terminal_free"
          - "-Wl,-u,_ghostty_terminal_vt_write"
          - "-Wl,-u,_ghostty_terminal_scroll_viewport"
          - "-Wl,-u,_ghostty_terminal_resize"
          - "-Wl,-u,_ghostty_terminal_get"
          - "-Wl,-u,_ghostty_terminal_set"
          - "-Wl,-u,_ghostty_paste_encode"
          - "-Wl,-u,_ghostty_key_encoder_new"
          - "-Wl,-u,_ghostty_key_encoder_free"
          - "-Wl,-u,_ghostty_key_encoder_setopt_from_terminal"
          - "-Wl,-u,_ghostty_key_encoder_encode"
          - "-Wl,-u,_ghostty_key_event_new"
          - "-Wl,-u,_ghostty_key_event_free"
          - "-Wl,-u,_ghostty_key_event_set_action"
          - "-Wl,-u,_ghostty_key_event_set_key"
          - "-Wl,-u,_ghostty_key_event_set_mods"
          - "-Wl,-u,_ghostty_key_event_set_utf8"
          - "-Wl,-u,_ghostty_key_event_set_unshifted_codepoint"
          - "-Wl,-u,_ghostty_mouse_encoder_new"
          - "-Wl,-u,_ghostty_mouse_encoder_free"
          - "-Wl,-u,_ghostty_mouse_encoder_setopt"
          - "-Wl,-u,_ghostty_mouse_encoder_setopt_from_terminal"
          - "-Wl,-u,_ghostty_mouse_encoder_encode"
          - "-Wl,-u,_ghostty_mouse_event_new"
          - "-Wl,-u,_ghostty_mouse_event_free"
          - "-Wl,-u,_ghostty_mouse_event_set_action"
          - "-Wl,-u,_ghostty_mouse_event_set_button"
          - "-Wl,-u,_ghostty_mouse_event_set_mods"
          - "-Wl,-u,_ghostty_mouse_event_set_position"
          - "-Wl,-u,_ghostty_formatter_terminal_new"
          - "-Wl,-u,_ghostty_formatter_format_alloc"
          - "-Wl,-u,_ghostty_formatter_free"
          - "-Wl,-u,_ghostty_free"
          - "-Wl,-u,_ghostty_render_state_new"
          - "-Wl,-u,_ghostty_render_state_free"
          - "-Wl,-u,_ghostty_render_state_update"
          - "-Wl,-u,_ghostty_render_state_get"
          - "-Wl,-u,_ghostty_render_state_row_iterator_new"
          - "-Wl,-u,_ghostty_render_state_row_iterator_free"
          - "-Wl,-u,_ghostty_render_state_row_iterator_next"
          - "-Wl,-u,_ghostty_render_state_row_get"
          - "-Wl,-u,_ghostty_render_state_row_cells_new"
          - "-Wl,-u,_ghostty_render_state_row_cells_free"
          - "-Wl,-u,_ghostty_render_state_row_cells_next"
          - "-Wl,-u,_ghostty_render_state_row_cells_get"
          - "-Wl,-u,_ghostty_cell_get"
          - "-Wl,-u,_ghostty_row_get"
          - "-Wl,-u,_ghostty_terminal_grid_ref"
          - "-Wl,-u,_ghostty_terminal_point_from_grid_ref"
          - "-Wl,-u,_ghostty_terminal_selection_format_alloc"
          - "-Wl,-u,_ghostty_terminal_take_render_scroll_rects"
    dependencies:
      - package: SpacesPackage
        product: spacesdevicecore
      - package: SpacesPackage
        product: spacesterminalcore
      - package: SpacesPackage
        product: spacesterminalmobileghostty
  SpacesMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile.tests
    dependencies:
      - target: SpacesMobile
      - package: SpacesPackage
        product: spacesterminalcore
      - package: SpacesPackage
        product: spacesterminalmobileghostty
  # Blocking screen-level coverage: built and run by scripts/ios-test-lane.sh alongside the unit
  # tests. Runs against Demo Mode's bundled recording, so it needs no daemon, no network, and no
  # paired Mac. Screen-level coverage that needs a live daemon belongs in SpacesMobileUITests below,
  # which stays on demand.
  SpacesMobileSmokeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SmokeUITests
      - UITestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile.smokeuitests
        TEST_TARGET_NAME: SpacesMobile
    dependencies:
      - target: SpacesMobile
  # On-demand only (apps/macos/Tests/e2e.sh mobile): these drive a live daemon and a paired Mac.
  SpacesMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - UITests
      - UITestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: BEMDA62NB6
        PRODUCT_BUNDLE_IDENTIFIER: dev.usespaces.spacesmobile.uitests
        TEST_TARGET_NAME: SpacesMobile
    dependencies:
      - target: SpacesMobile
schemes:
  SpacesMobile:
    build:
      targets:
        SpacesMobile: all
        SpacesMobileTests: [test]
        SpacesMobileSmokeUITests: [test]
        SpacesMobileUITests: [test]
    run:
      storeKitConfiguration: SpacesMobile.storekit
    test:
      targets:
        - SpacesMobileTests
        - SpacesMobileSmokeUITests
        - SpacesMobileUITests
